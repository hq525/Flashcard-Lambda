AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Flashcard app backend - API Gateway + Lambda + DynamoDB + S3

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage; also suffixes the table and bucket names.

  FrontendOrigin:
    Type: String
    Description: Exact frontend origin, without a trailing slash (for example https://flashcards.example.com).
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$|^http://localhost:[0-9]+$'

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub flashcard-api-${StageName}
      StageName: !Ref StageName
      Auth:
        DefaultAuthorizer: OwnerAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          OwnerAuthorizer:
            UserPoolArn: !GetAtt OwnerUserPool.Arn
            Identity:
              Header: Authorization
              ValidationExpression: !Sub '^${OwnerUserPoolClient}$'
      BinaryMediaTypes: ['image/png', 'image/jpeg', 'image/gif', 'image/webp']
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          # Basic stage metrics remain available without paid method metrics.
          MetricsEnabled: false
          DataTraceEnabled: false
      # Stage throttles are abuse guardrails, not guaranteed billing caps.
      Cors:
        AllowOrigin: !Sub "'${FrontendOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              Cache-Control: "'no-store'"
              X-Content-Type-Options: "'nosniff'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              Cache-Control: "'no-store'"
              X-Content-Type-Options: "'nosniff'"

  OwnerUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub flashcard-owner-${StageName}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]

  OwnerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: owner
      Description: The single account authorized to access this private library.
      UserPoolId: !Ref OwnerUserPool

  OwnerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OwnerUserPool
      ClientName: !Sub flashcard-browser-${StageName}
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Sub '${FrontendOrigin}/auth/callback']
      LogoutURLs: [!Sub '${FrontendOrigin}/']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH]
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10
      IdTokenValidity: 5
      AccessTokenValidity: 5
      RefreshTokenValidity: 1
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  OwnerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref OwnerUserPool
      Domain: !Sub flashcards-${AWS::AccountId}-${AWS::Region}-${StageName}
      ManagedLoginVersion: 1

  FlashcardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub flashcard-backend-${StageName}
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      CodeUri: .
      Timeout: 30
      MemorySize: 512
      # Bound concurrent work; this does not cap S3 storage or overall billing.
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref Table
          S3_BUCKET: !Ref ImageBucket
          AUTH_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPool}
          AUTH_CLIENT_ID: !Ref OwnerUserPoolClient
          ALLOWED_ORIGIN: !Ref FrontendOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt Table.Arn
                - !Sub ${Table.Arn}/index/*
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub ${ImageBucket.Arn}/images/*
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  Table:
    Type: AWS::DynamoDB::Table
    # Card data survives `sam delete` and any update that would replace
    # the table. Orphaned tables must then be deleted by hand.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub flash-card-app-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # Throughput guardrails; monitor storage, backup and total costs separately.
      OnDemandThroughput:
        MaxReadRequestUnits: 100
        MaxWriteRequestUnits: 50
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: entity_type
          AttributeType: S
        - AttributeName: category_id
          AttributeType: S
        - AttributeName: deck_id
          AttributeType: S
        - AttributeName: card_id
          AttributeType: S
        - AttributeName: card_answer_section_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: entity_type-index
          KeySchema:
            - AttributeName: entity_type
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: category_id-index
          KeySchema:
            - AttributeName: category_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: deck_id-index
          KeySchema:
            - AttributeName: deck_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: card_id-index
          KeySchema:
            - AttributeName: card_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: card_answer_section_id-index
          KeySchema:
            - AttributeName: card_answer_section_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub flash-card-app-media-${StageName}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRecoverableOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [GET, HEAD]
            AllowedHeaders: ['*']
            MaxAge: 300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Keep outstanding legacy presigned PUT grants revoked throughout
          # cutover and afterwards; managed uploads use images/* instead.
          - Sid: DenyLegacyUploads
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource:
              - !Sub ${ImageBucket.Arn}/question-images/*
              - !Sub ${ImageBucket.Arn}/answer-images/*
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ImageBucket.Arn
              - !Sub ${ImageBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref ImageBucket
  AuthIssuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPool}
  AuthClientId:
    Value: !Ref OwnerUserPoolClient
  AuthDomain:
    Value: !Sub https://${OwnerUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  UserPoolId:
    Value: !Ref OwnerUserPool
  MediaOrigin:
    Value: !Sub https://${ImageBucket}.s3.${AWS::Region}.amazonaws.com
